<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Blossom Garden Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #04060f;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. ละอองแสงหิ่งห้อยเรืองแสง (Fireflies)
    const fireflies = [];
    for (let i = 0; i < 45; i++) {
      fireflies.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + 1,
        alpha: Math.random(),
        speedY: (Math.random() - 0.5) * 0.4,
        speedX: (Math.random() - 0.5) * 0.5,
        pulseSpeed: Math.random() * 0.02 + 0.01
      });
    }

    // 2. หัวใจลอยพริ้วไหว (Floating Hearts)
    const hearts = [];
    for (let i = 0; i < 20; i++) {
      hearts.push({
        x: Math.random() * width,
        y: height + Math.random() * 200,
        size: Math.random() * 12 + 8,
        speedY: Math.random() * 0.7 + 0.3,
        swayPhase: Math.random() * Math.PI * 2,
        alpha: Math.random() * 0.6 + 0.3
      });
    }

    // ฟังก์ชันวาดรูปหัวใจ
    function drawHeart(x, y, size, color = '#ff758f', alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;

      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size * 1.2);
      ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.fill();
      ctx.restore();
    }

    // 3. วาดใบไม้รูปรีสีเขียวเข้ม-สว่าง
    function drawLeaf(x, y, length, angle, scale, isDark = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);

      ctx.fillStyle = isDark ? '#14452f' : '#2d6a4f';
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 6;

      ctx.beginPath();
      ctx.ellipse(0, -length / 2, 11, length / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // เส้นกลางใบ
      ctx.strokeStyle = isDark ? '#092519' : '#1b4332';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -length);
      ctx.stroke();

      ctx.restore();
    }

    // 4. วาดดอกไม้สีชมพู (5 กลีบ)
    function drawFlower(x, y, scale) {
      if (scale <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // รังสีออร่าสีชมพูเรืองแสงรอบดอก
      const aura = ctx.createRadialGradient(0, 0, 5, 0, 0, 55);
      aura.addColorStop(0, 'rgba(255, 182, 193, 0.45)');
      aura.addColorStop(1, 'rgba(255, 182, 193, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, 55, 0, Math.PI * 2);
      ctx.fill();

      // วาด 5 กลีบดอกทรงรีสีชมพู
      ctx.shadowColor = 'rgba(255, 105, 180, 0.6)';
      ctx.shadowBlur = 12;

      for (let i = 0; i < 5; i++) {
        const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
        ctx.save();
        ctx.rotate(angle);

        const petalGrad = ctx.createLinearGradient(0, 0, 0, -32);
        petalGrad.addColorStop(0, '#ff477e');
        petalGrad.addColorStop(0.5, '#ff85a1');
        petalGrad.addColorStop(1, '#ffc2d1');

        ctx.fillStyle = petalGrad;
        ctx.beginPath();
        ctx.ellipse(0, -18, 14, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // เกสรกลางดอกสีขาว-เหลืองเรืองแสง
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 15;
      const centerGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 11);
      centerGrad.addColorStop(0, '#ffffff');
      centerGrad.addColorStop(0.6, '#ffea00');
      centerGrad.addColorStop(1, '#ff9e00');

      ctx.fillStyle = centerGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 5. วาดกอหญ้าเขียวสดที่พื้นล่าง
    function drawGrassClump(x, baseHeight) {
      ctx.save();
      ctx.strokeStyle = '#208b3a';
      ctx.lineCap = 'round';

      const blades = [
        { dx: -60, h: 140, curve: -40, w: 6, color: '#1b4332' },
        { dx: -35, h: 190, curve: -30, w: 7, color: '#2d6a4f' },
        { dx: -15, h: 230, curve: -15, w: 8, color: '#40916c' },
        { dx: 15, h: 220, curve: 15, w: 8, color: '#2d6a4f' },
        { dx: 38, h: 180, curve: 30, w: 7, color: '#52b788' },
        { dx: 60, h: 130, curve: 45, w: 5, color: '#1b4332' }
      ];

      blades.forEach(b => {
        ctx.strokeStyle = b.color;
        ctx.lineWidth = b.w;
        ctx.beginPath();
        ctx.moveTo(x + b.dx, baseHeight);
        ctx.quadraticCurveTo(x + b.dx + b.curve * 0.5, baseHeight - b.h * 0.6, x + b.dx + b.curve, baseHeight - b.h);
        ctx.stroke();
      });

      ctx.restore();
    }

    // 6. วาดวงกลมประดับหัวใจริมขอบซ้าย-ขวา
    function drawSideDecoration() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 182, 193, 0.35)';
      ctx.lineWidth = 2;

      // ด้านซ้าย
      ctx.beginPath();
      ctx.arc(0, height * 0.3, 70, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, height * 0.3, 45, 0, Math.PI * 2);
      ctx.stroke();
      drawHeart(-15, height * 0.3 - 20, 16, '#ff477e', 0.8);

      // ด้านขวา
      ctx.beginPath();
      ctx.arc(width, height * 0.35, 60, 0, Math.PI * 2);
      ctx.stroke();
      drawHeart(width - 25, height * 0.35 - 15, 14, '#ff758f', 0.7);

      ctx.restore();
    }

    let progress = 0; // ควบคุมอนิเมชันการค่อยๆ เติบโตขึ้นของต้นไม้

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // ท้องฟ้าพื้นหลังกลางคืน
      const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, width * 0.7);
      bgGrad.addColorStop(0, '#0c1527');
      bgGrad.addColorStop(1, '#04060f');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 1. วาดวงกลมตกแต่งข้างขอบ
      drawSideDecoration();

      // 2. วาดหิ่งห้อยเรืองแสง
      fireflies.forEach(f => {
        f.x += f.speedX;
        f.y += f.speedY;
        f.alpha += f.pulseSpeed;
        if (f.alpha > 1 || f.alpha < 0.2) f.pulseSpeed = -f.pulseSpeed;
        if (f.x < 0) f.x = width;
        if (f.x > width) f.x = 0;
        if (f.y < 0) f.y = height;
        if (f.y > height) f.y = 0;

        ctx.save();
        ctx.globalAlpha = Math.abs(f.alpha);
        ctx.fillStyle = '#ccff33';
        ctx.shadowColor = '#70e000';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 3. วาดกอหญ้าซ้ายและขวา
      drawGrassClump(width * 0.15, height);
      drawGrassClump(width * 0.85, height);
      drawGrassClump(width * 0.28, height);
      drawGrassClump(width * 0.72, height);

      // 4. คำนวณความสูงกิ่งก้านและดอกไม้กลาง
      if (progress < 1) progress += 0.008;

      const baseX = width / 2;
      const baseY = height + 30;

      // ตำแหน่งดอกไม้ 4 ดอก
      const flowers = [
        { x: baseX, y: height * 0.28, scale: 1.1 },       // ดอกบนสุด
        { x: baseX, y: height * 0.40, scale: 1.0 },       // ดอกกลาง
        { x: baseX - 95, y: height * 0.44, scale: 0.95 },  // ดอกซ้าย
        { x: baseX + 95, y: height * 0.38, scale: 0.95 }   // ดอกขวา
      ];

      // วาดก้านไม้หลักสีเขียว
      ctx.save();
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';

      flowers.forEach(f => {
        const currentY = baseY - (baseY - f.y) * progress;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.quadraticCurveTo((baseX + f.x) / 2, (baseY + currentY) / 2, f.x, currentY);
        ctx.stroke();
      });
      ctx.restore();

      // วาดใบไม้แน่นๆ กลางลำต้น
      const leafPositions = [
        { x: baseX - 20, y: height * 0.75, len: 65, angle: -0.8, dark: true },
        { x: baseX + 20, y: height * 0.72, len: 65, angle: 0.8, dark: false },
        { x: baseX - 35, y: height * 0.65, len: 70, angle: -0.7, dark: false },
        { x: baseX + 35, y: height * 0.62, len: 70, angle: 0.7, dark: true },
        { x: baseX - 45, y: height * 0.54, len: 60, angle: -0.6, dark: true },
        { x: baseX + 45, y: height * 0.51, len: 60, angle: 0.6, dark: false },
        { x: baseX - 60, y: height * 0.48, len: 55, angle: -0.5, dark: false },
        { x: baseX + 60, y: height * 0.44, len: 55, angle: 0.5, dark: true },
      ];

      leafPositions.forEach(l => {
        if (progress > 0.3) {
          const lScale = Math.min(1, (progress - 0.3) * 1.5);
          drawLeaf(l.x, l.y, l.len, l.angle, lScale, l.dark);
        }
      });

      // วาดดอกไม้ 4 ดอกเมื่อก้านยาวขึ้น
      flowers.forEach(f => {
        if (progress > 0.4) {
          const fScale = f.scale * Math.min(1, (progress - 0.4) * 1.6);
          drawFlower(f.x, f.y, fScale);
        }
      });

      // 5. วาดหัวใจลอยพริ้วไหว
      hearts.forEach(h => {
        h.y -= h.speedY;
        h.swayPhase += 0.02;
        const currentX = h.x + Math.sin(h.swayPhase) * 15;

        if (h.y < -30) {
          h.y = height + Math.random() * 50;
          h.x = Math.random() * width;
        }

        drawHeart(currentX, h.y, h.size, '#ff758f', h.alpha);
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
